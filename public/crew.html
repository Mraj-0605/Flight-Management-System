<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crew Dashboard - SkyFleet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            margin-top: 0.5rem;
            background: white;
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            z-index: 50;
        }
        .dropdown-menu.active {
            display: block;
            animation: fadeIn 0.2s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .calendar-day {
            min-height: 120px;
            padding: 8px;
            background-color: white;
            border: 1px solid #e2e8f0;
            border-radius: 0.375rem;
            transition: all 0.2s;
        }
        .calendar-day:hover { border-color: #3b82f6; }
        .calendar-day.other-month {
            background-color: #f8fafc;
            color: #94a3b8;
        }
        .calendar-day-header {
            font-weight: 600;
            font-size: 0.875rem;
            text-align: right;
        }
        .flight-event {
            background-color: #e0f2fe;
            border-left: 4px solid #0ea5e9;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-top: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .flight-event:hover {
            background-color: #bae6fd;
        }
    </style>
</head>
<body class="bg-slate-100">

    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="px-4 sm:px-6 lg:px-8 py-3 flex justify-between items-center h-16">
            <div class="flex items-center">
                <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                <span class="ml-3 text-xl font-bold text-slate-800">SkyFleet Crew Portal</span>
            </div>
            <div class="flex items-center space-x-4">
                <div class="relative">
                    <button onclick="toggleDropdown()" class="flex items-center space-x-3 focus:outline-none hover:bg-gray-100 rounded-lg p-2 transition-colors">
                        <img class="h-9 w-9 rounded-full ring-2 ring-offset-2 ring-blue-500" id="user-avatar" src="https://ui-avatars.com/api/?name=Crew+Member&background=3b82f6&color=fff" alt="Crew Member">
                        <div class="text-left hidden md:block">
                            <p class="text-sm font-semibold text-slate-700" id="user-name-display">Crew Member</p>
                            <p class="text-xs text-slate-500" id="user-role-display">Loading...</p>
                        </div>
                        <svg class="h-5 w-5 text-slate-400 hidden md:block" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                    </button>
                    
                    <div id="user-dropdown" class="dropdown-menu w-56">
                        <div class="px-4 py-3 border-b">
                            <p class="text-sm font-medium text-gray-900">Signed in as</p>
                            <p class="text-sm text-gray-500 truncate" id="user-email-dropdown">crew@skyfleet.com</p>
                        </div>
                        <div class="py-1">
                            <a href="#" onclick="logout()" class="w-full text-left flex items-center px-4 py-2 text-sm text-red-600 hover:bg-red-50">
                                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                                Sign Out
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="p-6 space-y-6">
        <h1 class="text-3xl font-bold text-slate-800" id="welcome-message">Welcome, Crew Member!</h1>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-white p-6 rounded-lg shadow">
                    <h3 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">Your Information</h3>
                    <div class="space-y-2 text-sm">
                        <p><strong>Name:</strong> <span id="info-name"></span></p>
                        <p><strong>Email:</strong> <span id="info-email"></span></p>
                        <p><strong>Role:</strong> <span id="info-role"></span></p>
                        <p><strong>Status:</strong> <span id="info-status" class="font-semibold"></span></p>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-lg shadow">
                    <h3 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">Upcoming Flights</h3>
                    <div id="upcoming-flights-list" class="space-y-3">
                        <p class="text-slate-500 text-sm">Loading your schedule...</p>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-2 bg-white p-6 rounded-lg shadow">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-slate-800">Your Flight Calendar</h2>
                    <div class="flex items-center gap-4">
                        <button id="prev-month" class="p-2 rounded-full hover:bg-slate-100 font-bold">&lt;</button>
                        <h3 id="calendar-month-year" class="text-lg font-semibold"></h3>
                        <button id="next-month" class="p-2 rounded-full hover:bg-slate-100 font-bold">&gt;</button>
                    </div>
                </div>
                <div class="grid grid-cols-7 gap-2 text-center font-semibold text-sm text-slate-600 mb-2">
                    <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
                </div>
                <div id="calendar-grid">
                    </div>
            </div>
        </div>
    </main>
    
    <script src="curd-api.js"></script>
    <script src="crew-dashboard.js"></script>
</body>
</html>
