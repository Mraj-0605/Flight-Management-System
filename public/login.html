<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SkyFleet Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-8">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 rounded-full mb-4">
                <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-gray-800">SkyFleet Portal</h1>
            <p class="text-gray-500 mt-2">Sign in to your Portal</p>
        </div>

        <form id="login-form" class="space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"
                    placeholder="Enter your email"
                >
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"
                    placeholder="Enter your password"
                >
            </div>

            <button 
                type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition duration-200 transform hover:scale-[1.02] active:scale-[0.98]"
            >
                Sign In
            </button>
        </form>

        <div class="mt-6 grid sm:grid-cols-3 gap-4">
            <div class="p-3 bg-blue-50 border border-blue-200 rounded-lg">
                <p class="text-sm text-blue-800 font-medium">Admin:</p>
                <p class="text-xs text-blue-600 mt-1">admin@skyfleet.com</p>
                <p class="text-xs text-blue-600">admin123</p>
            </div>
             <div class="p-3 bg-indigo-50 border border-indigo-200 rounded-lg">
                <p class="text-sm text-indigo-800 font-medium">Crew:</p>
                <p class="text-xs text-indigo-600 mt-1">crew@skyfleet.com</p>
                <p class="text-xs text-indigo-600">crew123</p>
            </div>
             <div class="p-3 bg-green-50 border border-green-200 rounded-lg">
                <p class="text-sm text-green-800 font-medium">Passenger:</p>
                <p class="text-xs text-green-600 mt-1">pass@skyfleet.com</p>
                <p class="text-xs text-green-600">pass123</p>
            </div>
        </div>
    </div>
    
    <script src="curd-api.js"></script> 
    
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                Swal.fire('Error', 'Please fill in all fields', 'error');
                return;
            }

            try {
                // Show loading
                Swal.fire({
                    title: 'Signing in...',
                    text: 'Please wait',
                    allowOutsideClick: false,
                    didOpen: () => {
                        Swal.showLoading();
                    }
                });

                const data = await AuthAPI.login(email, password);
                
                // Close loading Swal
                Swal.close();
                
                // Store token and user info
                localStorage.setItem('authToken', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                // --- START OF CORRECTION ---
                const role = data.user.role;
                if (role === 'admin') {
                    window.location.href = 'admin-dashboard.html';
                } else if (role === 'crew') {
                    window.location.href = 'crew_dashboard.html'; // Changed to crew_dashboard.html for consistency
                } else if (role === 'passenger') { // ADDED THIS CASE
                    window.location.href = 'user_dashboard.html';
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Access Denied',
                        text: 'Your user role does not have access to a portal.',
                        confirmButtonColor: '#3b82f6'
                    });
                    localStorage.removeItem('authToken');
                }
                // --- END OF CORRECTION ---
                
            } catch (error) {
                console.error('Login error:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'Login Failed',
                    text: error.message || 'Invalid credentials. Please try again.',
                    confirmButtonColor: '#3b82f6'
                });
            }
        });
    </script>
</body>
</html>
